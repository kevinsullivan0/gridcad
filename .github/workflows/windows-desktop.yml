name: Windows desktop
on:
  push:
    branches: [windows-desktop, main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reviewed operator regression baseline
        working-directory: operator
        run: python -m unittest discover -s tests -v

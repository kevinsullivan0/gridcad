name: Windows desktop
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Install pinned build and GUI-test tooling
        run: python -m pip install --disable-pip-version-check -r requirements-desktop-build.txt -r requirements-test.txt
      - name: Reviewed operator regression
        run: python -m unittest discover -s operator/tests -v
      - name: Rectangular desktop core regression
        run: python -m unittest discover -s tests -v
      - name: Source launcher regression
        run: python -m unittest discover -s tests -p "test_*launcher*.py" -v
      - name: Parse Windows launcher before building
        shell: pwsh
        run: |
          $parseErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'tools/windows_launcher.ps1'), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Build offline Windows portable distribution
        run: python tools/build_windows.py
      # The 3.13 installer can service an existing same-version installation.
      # Keep the test observer on a separate Python minor version so its own
      # standard library is independent of the runtime being installed.
      - name: Use independent Python for installer acceptance
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GUI observation tools
        run: python -m pip install --disable-pip-version-check -r requirements-desktop-build.txt
      - name: Source launcher first-run, repeat and recovery acceptance
        run: python tools/windows_launcher_acceptance.py --zip dist/GridCAD-Source-Windows-v1.0.1.zip --out launcher-qa --install-fixture
      - name: Combined distribution artifact contract
        shell: pwsh
        run: |
          $env:GRIDCAD_DISTRIBUTION_ZIP='dist/GridCAD-Windows-x64-v1.0.1.zip'
          python -m unittest discover -s tests -p test_distribution_journey.py -v
      - name: One-download install, shortcut and source recovery journey
        run: python tools/windows_distribution_acceptance.py --zip dist/GridCAD-Windows-x64-v1.0.1.zip --out distribution-qa --source
      - name: Automatic EXE failure fallback and offline source repeat
        run: python tools/windows_distribution_acceptance.py --zip dist/GridCAD-Windows-x64-v1.0.1.zip --out fallback-qa --exe-failure-fixture
      - name: Real extracted-package Windows GUI acceptance
        run: python tools/windows_gui_acceptance.py --zip dist/GridCAD-Windows-x64-v1.0.1.zip --out desktop-qa
      - name: Archive distribution journey evidence
        if: always()
        shell: pwsh
        run: |
          $stage=Join-Path $env:RUNNER_TEMP ('gridcad-evidence-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $stage | Out-Null
          foreach ($name in @('distribution-qa','fallback-qa')) {
            if (Test-Path $name) {
              $target=Join-Path $stage $name
              New-Item -ItemType Directory -Path $target | Out-Null
              Get-ChildItem $name -File | Where-Object { $_.Extension -in '.png','.log','.json' } | Copy-Item -Destination $target
            }
          }
          if ((Get-ChildItem $stage -Recurse -File).Count) { Compress-Archive -Path "$stage/*" -DestinationPath dist/GridCAD-distribution-evidence.zip -Force }
      - name: Package source launcher add-on
        if: always()
        shell: pwsh
        run: |
          python tools/package_source_launcher.py
          $evidence = @(Get-ChildItem launcher-qa -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.png','.log','.json' })
          if ($evidence.Count) {
            Compress-Archive -LiteralPath $evidence.FullName -DestinationPath dist/GridCAD-launcher-evidence.zip -Force
          }
      - name: Archive GUI evidence
        if: always()
        shell: pwsh
        run: |
          if (Test-Path desktop-qa) {
            New-Item -ItemType Directory -Force dist | Out-Null
            Compress-Archive -Path desktop-qa/*.png,desktop-qa/acceptance.json -DestinationPath dist/GridCAD-Windows-GUI-evidence.zip -Force
          }
      - name: Upload package and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GridCAD-Windows-desktop-candidate
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/GridCAD-source-launcher-SHA256.txt
          if-no-files-found: warn
